name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

# A newer push to the same branch cancels the older run (saves Actions minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --no-daemon
      # On a failure, keep the test reports so the exact assertion can be read.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # paths-filter lists a PR's changed files through the API.
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      # The job always runs (so a required check never hangs); its steps only on mobile changes.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'
      - if: steps.filter.outputs.mobile == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      # Core game logic: pure Dart, no Flutter needed.
      - if: steps.filter.outputs.mobile == 'true'
        working-directory: mobile/packages/songrush_core
        run: dart pub get && dart test
      - if: steps.filter.outputs.mobile == 'true'
        run: flutter pub get
      - if: steps.filter.outputs.mobile == 'true'
        run: flutter analyze
      - if: steps.filter.outputs.mobile == 'true'
        run: flutter test
      - if: steps.filter.outputs.mobile == 'true'
        run: flutter build web
