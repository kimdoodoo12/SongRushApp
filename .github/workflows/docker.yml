name: Docker image

# Builds the app image and pushes it to GHCR.
#   main -> ghcr.io/kimdoodoo12/songrush:latest  (what the server runs)
#   dev  -> ghcr.io/kimdoodoo12/songrush:dev     (for trying a build first)
# Every image also gets a sha-<commit> tag, so any version can be rolled back to.
on:
  push:
    branches: [main, dev]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kimdoodoo12/songrush

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # main only: tell the server (through AWS Systems Manager) to pull :latest and restart the app.
  # The AWS key lives in the "production" environment, which only the main branch can use.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: ap-southeast-2
      INSTANCE_ID: i-029cc43ab5ef75df1
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy on the server
        run: |
          set -euo pipefail
          # The script that runs on the server (as root, through the SSM agent).
          cat > deploy.json <<'EOF'
          {"commands":[
            "set -e",
            "cd /opt/songrush",
            "docker compose pull app",
            "docker compose up -d app",
            "for i in $(seq 1 24); do if curl -fsS --resolve animeopguessr.com:443:127.0.0.1 https://animeopguessr.com/health | grep -q ok; then echo healthy; break; fi; sleep 5; done",
            "curl -fsS --resolve animeopguessr.com:443:127.0.0.1 https://animeopguessr.com/health",
            "docker image prune -f",
            "docker compose ps"
          ]}
          EOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters file://deploy.json \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"
          # Wait for the server to finish (the CLI waiter gives up after about 100 s, so loop).
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Result: $STATUS"
          test "$STATUS" = Success
