spring.application.name=backend
server.error.whitelabel.enabled=false
server.forward-headers-strategy=native
# Cycle 156: gzip text, scripts, wasm and fonts (the Flutter build is ~13 MB uncompressed). Audio and
# raster images are already compressed and stay out of the list, so /audio and /cover are unchanged.
server.compression.enabled=true
server.compression.min-response-size=2KB
server.compression.mime-types=text/html,text/css,text/plain,text/javascript,application/javascript,application/json,application/wasm,font/ttf,font/otf,image/svg+xml,application/manifest+json
