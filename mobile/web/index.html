<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SongRush mobile: guess the anime from its OP/ED.">
  <meta name="theme-color" content="#1c0f1a">

  <!--
    Cycle 157: records what goes wrong while the app loads, from the very
    start, so the loading screen can show it on a phone with no dev tools.
    Keeps the last 10 short entries in window.__srDiag.
  -->
  <script>
    (function () {
      var diag = window.__srDiag = [];
      function add(text) {
        text = String(text).replace(/\s+/g, ' ').slice(0, 160);
        diag.push(text);
        if (diag.length > 10) diag.shift();
      }
      window.addEventListener('error', function (e) {
        var t = e && e.target;
        if (t && t !== window && (t.src || t.href)) {
          // A <script>, <link> or <img> that failed to load.
          add('load failed: <' + String(t.tagName).toLowerCase() + '> ' + (t.src || t.href));
        } else {
          add('error: ' + (e && e.message) + (e && e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        add('rejection: ' + (r && r.message ? r.message : r));
      });
      var original = console.error;
      console.error = function () {
        try {
          add('console: ' + Array.prototype.map.call(arguments, function (a) {
            return a && a.message ? a.message : String(a);
          }).join(' '));
        } catch (ignored) {
          // Recording must never break the page's own logging.
        }
        return original.apply(console, arguments);
      };
    })();
  </script>

  <!--
    Cycle 158: the app no longer uses Flutter's service worker (see
    flutter_bootstrap.js). Removes the one an earlier deploy installed under
    /m/, and Flutter's caches, without holding up the start. The count shows
    in the cycle-157 diagnostics.
  -->
  <script>
    (function () {
      function note(text) {
        var diag = window.__srDiag;
        if (!diag) return;
        diag.push(text);
        if (diag.length > 10) diag.shift();
      }
      function failed(what, e) {
        note(what + ' failed: ' + String(e && e.message ? e.message : e).slice(0, 120));
      }
      if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          var ours = registrations.filter(function (r) {
            return String(r.scope).indexOf('/m/') !== -1;
          });
          return Promise.all(ours.map(function (r) {
            return r.unregister().catch(function (e) {
              failed('sw unregister', e);
              return false;
            });
          }));
        }).then(function (results) {
          var count = results.filter(Boolean).length;
          if (count > 0) note('sw unregistered: ' + count);
        }).catch(function (e) {
          failed('sw cleanup', e);
        });
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (names) {
          var flutter = names.filter(function (n) {
            return /^flutter-(app-cache|temp-cache|app-manifest)/.test(n);
          });
          return Promise.all(flutter.map(function (n) { return caches.delete(n); }));
        }).then(function (results) {
          var count = results.filter(Boolean).length;
          if (count > 0) note('sw caches deleted: ' + count);
        }).catch(function (e) {
          failed('cache cleanup', e);
        });
      }
    })();
  </script>

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SongRush">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SongRush</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#1c0f1a">
  <!--
    Cycle 155: shown until Flutter draws its first frame, and left in place if
    it never does (a failed download, an old browser), so a phone can always
    reach the React web. ?ui=pc keeps it there even with blocked localStorage.
  -->
  <div id="loading" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#1c0f1a;color:#fff1e6;font:16px/1.5 sans-serif;text-align:center;padding:16px">
    <div id="loading-text">불러오는 중… / Loading…</div>
    <div>
      <a href="/?ui=pc" style="color:#ff8a4c">PC 버전으로 보기 / PC version</a>
      <a id="loading-retry" href="#" style="color:#ff8a4c;margin-left:16px;display:none">다시 시도 / Retry</a>
    </div>
    <div id="loading-diag" style="display:none;max-width:100%;color:#c4a3a8;font:11px/1.4 monospace;text-align:left;white-space:pre-wrap;word-break:break-all"></div>
  </div>
  <script>
    (function () {
      var started = Date.now();
      var timer = null;

      function hide() {
        var loading = document.getElementById('loading');
        if (loading) loading.remove();
        if (timer) clearInterval(timer);
        timer = null;
      }

      function hasSize(el) {
        if (!el) return false;
        var r = el.getBoundingClientRect();
        return r.width > 0 && r.height > 0;
      }

      // Cycle 157: the safety net for a browser where the first-frame event
      // never arrives: Flutter's view is on the page and has drawn something.
      function flutterDrawn() {
        var hosts = document.querySelectorAll('flutter-view, flt-glass-pane');
        for (var i = 0; i < hosts.length; i++) {
          var roots = [hosts[i]];
          if (hosts[i].shadowRoot) roots.push(hosts[i].shadowRoot);
          for (var j = 0; j < roots.length; j++) {
            var found = roots[j].querySelectorAll('canvas, flt-scene-host, flt-semantics-host');
            for (var k = 0; k < found.length; k++) {
              if (hasSize(found[k])) return true;
            }
          }
        }
        return false;
      }

      // Cycle 158: the app's big downloads so far, one line each. A browser
      // adds a resource here only once it has finished (or failed), so the
      // "missing" line names the ones not finished yet.
      function resourceLines() {
        if (!window.performance || !performance.getEntriesByType) return [];
        var wanted = /main\.dart\.js|canvaskit|soloud|\.ttf|flutter_bootstrap/;
        var lines = [];
        var variant = 'none requested';
        var seen = { bootstrap: false, main: false, ckJs: false, ckWasm: false };
        performance.getEntriesByType('resource').forEach(function (r) {
          var at = r.name.indexOf('/m/');
          if (at === -1 || !wanted.test(r.name)) return;
          var name = r.name.slice(at + 3).split('?')[0];
          var ck = /^canvaskit\/(?:(chromium|webparagraph)\/)?canvaskit\.js$/.exec(name);
          if (ck) variant = ck[1] || 'full';
          if (name === 'flutter_bootstrap.js') seen.bootstrap = true;
          if (name === 'main.dart.js') seen.main = true;
          if (/canvaskit\.js$/.test(name)) seen.ckJs = true;
          if (/canvaskit\.wasm$/.test(name)) seen.ckWasm = true;
          // responseStatus 0 is a failed request; Chrome 109+ reports it.
          var status = typeof r.responseStatus === 'number' && r.responseStatus !== 200
            ? ' status ' + r.responseStatus : '';
          lines.push('res: ' + name.replace(/^assets\/(packages\/|assets\/)?/, '').slice(-44) + ' ' +
            Math.round(r.duration) + 'ms ' +
            Math.round((r.transferSize || 0) / 1024) + '/' + Math.round((r.encodedBodySize || 0) / 1024) + 'KB' +
            status + (r.responseEnd === 0 ? ' (loading)' : ''));
        });
        var missing = [];
        if (!seen.bootstrap) missing.push('flutter_bootstrap.js');
        if (!seen.main) missing.push('main.dart.js');
        if (!seen.ckJs) missing.push('canvaskit.js');
        if (!seen.ckWasm) missing.push('canvaskit.wasm');
        lines.unshift('canvaskit variant: ' + variant);
        if (missing.length) lines.push('missing: ' + missing.join(', '));
        return lines;
      }

      function showSlow() {
        document.getElementById('loading-text').textContent = '오래 걸리고 있어요… / Still loading…';
        var retry = document.getElementById('loading-retry');
        retry.style.display = 'inline';
        retry.onclick = function (e) {
          e.preventDefault();
          location.reload();
        };
        var ua = String(navigator.userAgent).replace(/Mozilla\/5\.0 /, '').slice(0, 140);
        var diag = window.__srDiag || [];
        var connection = navigator.connection && navigator.connection.effectiveType;
        var lines = [
          'UA: ' + ua,
          'elapsed: ' + ((Date.now() - started) / 1000).toFixed(1) + 's' +
            (connection ? ', network: ' + connection : ''),
          'flutter-view: ' + (document.querySelector('flutter-view') ? 'yes' : 'no'),
          'crossOriginIsolated: ' + String(window.crossOriginIsolated),
          '_flutter: ' + (window._flutter ? 'yes' : 'no'),
          diag.length ? diag.join('\n') : '오류 없음 / no errors'
        ].concat(resourceLines());
        var box = document.getElementById('loading-diag');
        box.textContent = lines.join('\n');
        box.style.display = 'block';
      }

      window.addEventListener('flutter-first-frame', hide);
      timer = setInterval(function () {
        if (!document.getElementById('loading')) return hide();
        if (flutterDrawn()) return hide();
        // Refreshed on every tick so later diagnostics show up too.
        if (Date.now() - started >= 10000) showSlow();
      }, 500);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    flutter_soloud's init_soloud.js (it picks the single- or multi-threaded
    WASM build) is not loaded here: cycle 159 loads it from Dart when the
    sound engine starts (lib/platform/soloud_script_web.dart), so its 2 MB
    stay off the first load.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
