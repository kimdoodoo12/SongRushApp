  <!--
    Cycle 157: records what goes wrong while the app loads, from the very
    start, so the loading screen can show it on a phone with no dev tools.
    Keeps the last 10 short entries in window.__srDiag.
  -->
  <script>
    (function () {
      var diag = window.__srDiag = [];
      function add(text) {
        text = String(text).replace(/\s+/g, ' ').slice(0, 160);
        diag.push(text);
        if (diag.length > 10) diag.shift();
      }
      window.addEventListener('error', function (e) {
        var t = e && e.target;
        if (t && t !== window && (t.src || t.href)) {
          // A <script>, <link> or <img> that failed to load.
          add('load failed: <' + String(t.tagName).toLowerCase() + '> ' + (t.src || t.href));
        } else {
          add('error: ' + (e && e.message) + (e && e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        add('rejection: ' + (r && r.message ? r.message : r));
      });
      var original = console.error;
      console.error = function () {
        try {
          add('console: ' + Array.prototype.map.call(arguments, function (a) {
            return a && a.message ? a.message : String(a);
          }).join(' '));
        } catch (ignored) {
          // Recording must never break the page's own logging.
        }
        return original.apply(console, arguments);
      };
    })();
  </script>

  <!--
    Cycle 158: the app no longer uses Flutter's service worker (see
    flutter_bootstrap.js). Removes the one an earlier deploy installed under
    /m/, and Flutter's caches, without holding up the start. The count shows
    in the cycle-157 diagnostics.
  -->
  <script>
    (function () {
      function note(text) {
        var diag = window.__srDiag;
        if (!diag) return;
        diag.push(text);
        if (diag.length > 10) diag.shift();
      }
      function failed(what, e) {
        note(what + ' failed: ' + String(e && e.message ? e.message : e).slice(0, 120));
      }
      if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          var ours = registrations.filter(function (r) {
            return String(r.scope).indexOf('/m/') !== -1;
          });
          return Promise.all(ours.map(function (r) {
            return r.unregister().catch(function (e) {
              failed('sw unregister', e);
              return false;
            });
          }));
        }).then(function (results) {
          var count = results.filter(Boolean).length;
          if (count > 0) note('sw unregistered: ' + count);
        }).catch(function (e) {
          failed('sw cleanup', e);
        });
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (names) {
          var flutter = names.filter(function (n) {
            return /^flutter-(app-cache|temp-cache|app-manifest)/.test(n);
          });
          return Promise.all(flutter.map(function (n) { return caches.delete(n); }));
        }).then(function (results) {
          var count = results.filter(Boolean).length;
          if (count > 0) note('sw caches deleted: ' + count);
        }).catch(function (e) {
          failed('cache cleanup', e);
        });
      }
    })();
  </script>

<body style="margin:0;background:#1c0f1a">
  <!--
    Cycle 155: shown until Flutter draws its first frame, and left in place if
    it never does (a failed download, an old browser), so a phone can always
    reach the React web. ?ui=pc keeps it there even with blocked localStorage.
  -->
  <!--
    Cycle 166: one language (from navigator.language), friendlier lines that
    change with the elapsed time (0 / 5 / 15 / 30 s), a progress bar driven
    by the startup files' bytes, and a rotating tip. The PC link is visible
    in the markup and the script hides it until 15 s, so a browser where the
    script fails still has it.

  <div id="loading" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#1c0f1a;color:#fff1e6;font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Apple SD Gothic Neo','Malgun Gothic','Hiragino Sans','Noto Sans KR','Noto Sans JP',sans-serif;text-align:center;padding:24px;box-sizing:border-box;overflow-y:auto">
    <div id="loading-title" style="font-size:20px;font-weight:bold;line-height:1.4">🎵 무대 준비 중…</div>
    <div id="loading-sub" style="font-size:14px;color:#c4a3a8;max-width:320px">처음 한 번만 조금 오래 걸려요</div>
    <div style="width:100%;max-width:280px;margin-top:8px">
      <div style="height:6px;background:#3a1f30;border-radius:3px;overflow:hidden">
        <div id="loading-bar" style="height:100%;width:0;background:#ff8a4c;border-radius:3px;transition:width .3s linear"></div>
      </div>
      <div id="loading-pct" style="font-size:12px;color:#c4a3a8;margin-top:4px">0%</div>
    </div>
    <div id="loading-tip" style="font-size:13px;color:#c4a3a8;max-width:320px;min-height:40px"></div>
    <div id="loading-links">
      <a id="loading-pc" href="/?ui=pc" style="color:#ff8a4c">PC 버전으로 보기</a>
      <a id="loading-retry" href="#" style="color:#ff8a4c;margin-left:16px;display:none">다시 시도</a>
    </div>
    <div id="loading-diag" style="display:none;max-width:100%;color:#c4a3a8;font:11px/1.4 monospace;text-align:left;white-space:pre-wrap;word-break:break-all"></div>
  </div>
  <script>
    (function () {
      var started = Date.now();
      var timer = null;

      function hide() {
        var loading = document.getElementById('loading');
        if (loading) loading.remove();
        if (timer) clearInterval(timer);
        timer = null;
      }

      function hasSize(el) {
        if (!el) return false;
        var r = el.getBoundingClientRect();
        return r.width > 0 && r.height > 0;
      }

      // Cycle 157: the safety net for a browser where the first-frame event
      // never arrives: Flutter's view is on the page and has drawn something.
      function flutterDrawn() {
        var hosts = document.querySelectorAll('flutter-view, flt-glass-pane');
        for (var i = 0; i < hosts.length; i++) {
          var roots = [hosts[i]];
          if (hosts[i].shadowRoot) roots.push(hosts[i].shadowRoot);
          for (var j = 0; j < roots.length; j++) {
            var found = roots[j].querySelectorAll('canvas, flt-scene-host, flt-semantics-host');
            for (var k = 0; k < found.length; k++) {
              if (hasSize(found[k])) return true;
            }
          }
        }
        return false;
      }

      // Cycle 158: the app's big downloads so far, one line each. A browser
      // adds a resource here only once it has finished (or failed), so the
      // "missing" line names the ones not finished yet.
      function resourceLines() {
        if (!window.performance || !performance.getEntriesByType) return [];
        var wanted = /main\.dart\.js|canvaskit|soloud|\.ttf|flutter_bootstrap/;
        var lines = [];
        var variant = 'none requested';
        var seen = { bootstrap: false, main: false, ckJs: false, ckWasm: false };
        performance.getEntriesByType('resource').forEach(function (r) {
          var at = r.name.indexOf('/m/');
          if (at === -1 || !wanted.test(r.name)) return;
          var name = r.name.slice(at + 3).split('?')[0];
          var ck = /^canvaskit\/(?:(chromium|webparagraph)\/)?canvaskit\.js$/.exec(name);
          if (ck) variant = ck[1] || 'full';
          if (name === 'flutter_bootstrap.js') seen.bootstrap = true;
          if (name === 'main.dart.js') seen.main = true;
          if (/canvaskit\.js$/.test(name)) seen.ckJs = true;
          if (/canvaskit\.wasm$/.test(name)) seen.ckWasm = true;
          // responseStatus 0 is a failed request; Chrome 109+ reports it.

          lines.push('res: ' + name.replace(/^assets\/(packages\/|assets\/)?/, '').slice(-44) + ' ' +
            Math.round(r.duration) + 'ms ' +
            Math.round((r.transferSize || 0) / 1024) + '/' + Math.round((r.encodedBodySize || 0) / 1024) + 'KB' +
            status + (r.responseEnd === 0 ? ' (loading)' : ''));
        });
        var missing = [];
        if (!seen.bootstrap) missing.push('flutter_bootstrap.js');
        if (!seen.main) missing.push('main.dart.js');
        if (!seen.ckJs) missing.push('canvaskit.js');
        if (!seen.ckWasm) missing.push('canvaskit.wasm');
        lines.unshift('canvaskit variant: ' + variant);
        if (missing.length) lines.push('missing: ' + missing.join(', '));
        return lines;
      }

      function showSlow() {
        var retry = document.getElementById('loading-retry');
        retry.style.display = 'inline';
        retry.onclick = function (e) {
          e.preventDefault();
          location.reload();
        };
        var ua = String(navigator.userAgent).replace(/Mozilla\/5\.0 /, '').slice(0, 140);
        var diag = window.__srDiag || [];
        var connection = navigator.connection && navigator.connection.effectiveType;
        var lines = [
          'UA: ' + ua,
          'elapsed: ' + ((Date.now() - started) / 1000).toFixed(1) + 's' +
            (connection ? ', network: ' + connection : ''),
          'flutter-view: ' + (document.querySelector('flutter-view') ? 'yes' : 'no'),
          'crossOriginIsolated: ' + String(window.crossOriginIsolated),
          '_flutter: ' + (window._flutter ? 'yes' : 'no'),
          diag.length ? diag.join('\n') : '오류 없음 / no errors'
        ].concat(resourceLines());
        var box = document.getElementById('loading-diag');
        box.textContent = lines.join('\n');
        box.style.display = 'block';
      }

      // Cycle 166: the copy, in the browser's language (ko, ja, else en).
      var lang = String(navigator.language || '').toLowerCase();
      lang = lang.indexOf('ko') === 0 ? 'ko' : lang.indexOf('ja') === 0 ? 'ja' : 'en';
      var COPY = {
        ko: {
          stages: [
            ['🎵 무대 준비 중…', '처음 한 번만 조금 오래 걸려요'],
            ['거의 다 왔어요', '게임 엔진을 내려받는 중이에요. 다음부터는 금방 열려요'],
            ['조금만 더 기다려 주세요', '인터넷이 느리면 시간이 더 걸릴 수 있어요'],
            ['오래 걸리고 있어요', '인터넷이 느리면 시간이 더 걸릴 수 있어요']
          ],
          pc: 'PC 버전으로 보기',
          retry: '다시 시도',
          tips: [
            '띄어쓰기와 문장부호는 몰라도 정답이에요',
            '한국어·영어·일본어·로마자 제목 모두 정답이에요',
            '객관식에서는 표지를 한 번만 고를 수 있어요',
            '스킵은 과반이 누르면 넘어가요',
            '방 링크를 보내면 친구가 바로 들어와요'
          ]
        },
        en: {
          stages: [
            ['🎵 Setting the stage…', 'Only the first visit takes a little while'],
            ['Almost there', 'Downloading the game engine. Next time it opens quickly'],
            ['Just a moment more', 'A slow connection can take longer'],
            ['This is taking a while', 'A slow connection can take longer']
          ],
          pc: 'PC version',
          retry: 'Retry',
          tips: [
            'Spaces and punctuation don\'t matter in an answer',
            'Korean, English, Japanese and romaji titles all count',
            'In multiple choice you can pick a cover only once',
            'A skip passes when most players vote for it',
            'Send the room link and friends join right away'
          ]
        },
        ja: {
          stages: [
            ['🎵 ステージ準備中…', '初回だけ少し時間がかかります'],
            ['もうすぐです', 'ゲームエンジンをダウンロード中です。次回からはすぐ開きます'],
            ['もう少しお待ちください', '回線が遅いと時間がかかることがあります'],
            ['時間がかかっています', '回線が遅いと時間がかかることがあります']
          ],
          pc: 'PC版で見る',
          retry: '再読み込み',
          tips: [
            'スペースや句読点は気にしなくても正解になります',
            '韓国語・英語・日本語・ローマ字のタイトルがすべて正解です',
            '選択式ではジャケットを一度だけ選べます',
            'スキップは過半数が押すと次の曲へ進みます',
            'ルームのリンクを送れば友だちがすぐ参加できます'
          ]
        }

      // Cycle 166: the big startup files with their approximate compressed
      // sizes, the bar's denominator. A finished file counts with its real
      // bytes (transferSize, else encodedBodySize), or with its estimate when
      // the browser reports 0 (a cached file); an unfinished one counts with
      // its estimate. Entries appear only when a file has finished, so the
      // bar also creeps on its own between them, never past 95%.

      var FILES = [
        { re: /^flutter_bootstrap\.js$/, size: 10 * KB },
        { re: /^main\.dart\.js$/, size: 900 * KB },
        { re: /canvaskit\.js$/, size: 90 * KB },
        { re: /canvaskit\.wasm$/, size: 2000 * KB },
        { re: /\.(?:ttf|otf)$/, size: 700 * KB, group: true }
      ];
      var CAP = 0.95;
      var shown = 0;
      var lastStage = -1;
      var lastTip = -1;
      var tipOffset = Math.floor(Math.random() * COPY.tips.length);

      function byteFraction() {
        if (!window.performance || !performance.getEntriesByType) return 0;
        var done = [];
        for (var i = 0; i < FILES.length; i++) done.push(0);
        var counted = {};
        performance.getEntriesByType('resource').forEach(function (r) {
          var at = r.name.indexOf('/m/');
          if (at === -1 || !(r.responseEnd > 0)) return;
          var name = r.name.slice(at + 3).split('?')[0];
          for (var i = 0; i < FILES.length; i++) {
            if (!FILES[i].re.test(name)) continue;
            // Only one canvaskit variant (and one bootstrap) is loaded; a
            // repeat entry for the same file would count twice.
            if (!FILES[i].group && counted[i]) break;
            counted[i] = true;
            var bytes = r.transferSize || r.encodedBodySize || 0;
            done[i] += bytes > 0 ? bytes : FILES[i].size;
            break;
          }
        });
        var finished = 0;
        var total = 0;
        for (var j = 0; j < FILES.length; j++) {
          finished += done[j];
          // The font group is finished once it reaches its estimate.
          total += FILES[j].group
            ? Math.max(done[j], FILES[j].size)
            : (counted[j] ? done[j] : FILES[j].size);
        }
        return total > 0 ? finished / total : 0;
      }

      function setProgress() {
        var real = Math.min(byteFraction(), CAP);
        // Creep toward a share of the remaining work on every tick: 2% of
        // the gap, at least 0.05 points (0.2%/s), never past the target.
        var target = Math.min(CAP, real + (1 - real) * 0.6);
        shown = Math.max(shown, real);
        if (shown < target) {
          shown = Math.min(target, shown + Math.max((target - shown) * 0.02, 0.0005));
        }
        var pct = Math.floor(shown * 100);
        document.getElementById('loading-bar').style.width = (shown * 100).toFixed(1) + '%';
        document.getElementById('loading-pct').textContent = pct + '%';
      }

      function setStage(elapsed) {
        var stage = elapsed >= 30000 ? 3 : elapsed >= 15000 ? 2 : elapsed >= 5000 ? 1 : 0;
        if (stage !== lastStage) {
          lastStage = stage;
          document.getElementById('loading-title').textContent = COPY.stages[stage][0];
          document.getElementById('loading-sub').textContent = COPY.stages[stage][1];
          document.getElementById('loading-pc').style.display = stage >= 2 ? 'inline' : 'none';
        }
        var tip = (tipOffset + Math.floor(elapsed / 5000)) % COPY.tips.length;
        if (tip !== lastTip) {
          lastTip = tip;
          document.getElementById('loading-tip').textContent = COPY.tips[tip];
        }
        // Refreshed on every tick so later diagnostics show up too.
        if (stage === 3) showSlow();
      }

      function tick() {
        if (!document.getElementById('loading')) return hide();
        if (flutterDrawn()) return hide();
        setStage(Date.now() - started);
        setProgress();
      }

      document.documentElement.lang = lang;
      document.getElementById('loading-pc').textContent = COPY.pc;
      document.getElementById('loading-retry').textContent = COPY.retry;
      window.addEventListener('flutter-first-frame', hide);
      timer = setInterval(tick, 250);
      tick();
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->

    flutter_soloud's init_soloud.js (it picks the single- or multi-threaded
    WASM build) is not loaded here: cycle 159 loads it from Dart when the
    sound engine starts (lib/platform/soloud_script_web.dart), so its 2 MB
    stay off the first load.
  -->
  <!--
    Cycle 162: with ?debug=1 in the URL, a small overlay of the viewport
    and keyboard numbers (window.__srInset is the inset the app read,
    window.__srMqInset the one it applied), for a phone with no dev tools.
    Nothing is added without the query.
  -->
  <script>
    (function () {
      if (!/(?:^|[?&])debug=1(?:&|$)/.test(location.search)) return;
      var box = document.createElement('div');
      box.id = 'sr-debug';
      box.style.cssText = 'position:fixed;top:0;right:0;z-index:2147483647;pointer-events:none;' +
        'max-width:60vw;padding:4px 6px;background:rgba(0,0,0,0.6);color:#fff1e6;' +
        'font:10px/1.3 monospace;white-space:pre-wrap;word-break:break-all';
      document.body.appendChild(box);
      var started = Date.now();
      var log = [];
      var lastVvH = null;

      function num(v) {
        return typeof v === 'number' ? String(Math.round(v * 10) / 10) : '-';
      }
      function value(v) {
        return v === undefined || v === null ? '-' : num(v);
      }

      function refresh(reason) {
        var vv = window.visualViewport;
        var vvH = vv ? vv.height : null;
        if (vvH !== lastVvH) {
          log.push((Date.now() - started) + 'ms vvh ' + num(lastVvH) + '->' + num(vvH) +
            (reason ? ' (' + reason + ')' : ''));
          if (log.length > 6) log.shift();
          lastVvH = vvH;
        }
        var view = document.querySelector('flutter-view');
        var active = document.activeElement;
        // Into an open shadow root, where Flutter may keep its input.
        while (active && active.shadowRoot && active.shadowRoot.activeElement) {
          active = active.shadowRoot.activeElement;
        }
        var activeText = active ? active.tagName + (active.type ? ' ' + active.type : '') : '-';
        var lines = [
          'inner ' + window.innerWidth + 'x' + window.innerHeight,
          vv ? 'vv ' + num(vv.width) + 'x' + num(vv.height) + ' off(' + num(vv.offsetTop) + ',' +
            num(vv.offsetLeft) + ') ' + num(vv.scale) : 'vv none',
          'flutter-view h ' + (view ? num(view.getBoundingClientRect().height) : 'none'),
          'scrollY ' + num(window.scrollY),
          'active ' + activeText,
          '__srInset ' + value(window.__srInset),
          '__srMqInset ' + value(window.__srMqInset)
        ].concat(log);
        box.textContent = lines.join('\n');
      }

      function on(target, type) {
        target.addEventListener(type, function () { refresh(type); });
      }
      if (window.visualViewport) {
        on(window.visualViewport, 'resize');
        on(window.visualViewport, 'scroll');
      }
      on(window, 'resize');
      on(window, 'focusin');
      on(window, 'focusout');
      setInterval(function () { refresh(''); }, 250);
      refresh('start');
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
