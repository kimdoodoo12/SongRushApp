name: songrush_mobile
description: "SongRush mobile client (Flutter, web target first)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  # The material widgets' own texts (text selection) on iOS, in ko and ja.
  cupertino_ui: ^1.1.0
  # UI languages (cycle 148): gen-l10n ARB files in lib/l10n.
  flutter_localizations:
    sdk: flutter
  intl: any
  # Game logic lives in a pure-Dart package so it tests with `dart test` alone.
  songrush_core:
    path: packages/songrush_core
  # Audio (cycle 147, as the S-009 spike): Ogg Opus from memory, engine-clock starts.
  flutter_soloud: ^5.3.0
  http: ^1.6.0
  # The game socket (cycle 148).
  web_socket_channel: ^3.0.3
  # sessionStorage and localStorage on the web build (cycle 148).
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  # The room stylesheet's four families (frontend/src/room.css :root), from
  # the Google Fonts repository; see assets/fonts/README.md.
  fonts:
    - family: Jua
      fonts:
        - asset: assets/fonts/jua/Jua-Regular.ttf
    - family: Gowun Dodum
      fonts:
        - asset: assets/fonts/gowundodum/GowunDodum-Regular.ttf
    - family: IBM Plex Sans KR
      fonts:
        - asset: assets/fonts/ibmplexsanskr/IBMPlexSansKR-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibmplexsanskr/IBMPlexSansKR-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibmplexsanskr/IBMPlexSansKR-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/jetbrainsmono/JetBrainsMono-wght.ttf
